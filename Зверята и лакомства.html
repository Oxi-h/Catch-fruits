<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зверята и лакомства</title>
<style>
:root{--bg:#ece3d3;--card:#f7f1e6;--ink:#3a2e24;--acc:#8a5a2b;--line:#d3c4aa;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--card:#241d17;--ink:#f0e6d6;--acc:#e2a565;--line:#44392c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130f;--card:#241d17;--ink:#f0e6d6;--acc:#e2a565;--line:#44392c;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;justify-content:center;align-items:center}
#app{position:relative;width:min(100%,400px,calc((100dvh - 24px)*.643))}
canvas{width:100%;display:block;background:var(--card);border:2px solid var(--line);border-radius:18px;touch-action:none}
#ui{position:absolute;inset:0;background:var(--card);border-radius:18px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:18px;overflow:auto;box-sizing:border-box}
#ui[hidden]{display:none}
h1{margin:0;font-size:26px;line-height:1.15}
p{margin:0;line-height:1.5}
small{opacity:.7}
.pick,.big{display:flex;align-items:center;gap:12px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 12px;color:inherit;font:inherit;text-align:left;cursor:pointer}
.pick:hover,.big:hover,.pick:focus-visible,.big:focus-visible{border-color:var(--acc);outline:none}
.pick img{height:64px;width:64px;object-fit:contain;flex:none}
.pick b{display:block;font-size:18px}.pick span{font-size:13px;opacity:.75}
.big{justify-content:center;font-size:17px;font-weight:bold}
</style>
</head>

const CH=[
 {name:'Пибру',desc:'Самый быстрый, три жизни',speed:1.3,lives:3,fish:1,h:88},
 {name:'Выдра',desc:'Рыба даёт двойные очки',speed:1,lives:3,fish:2,h:84},
 {name:'Капибара',desc:'Большая и медлительная, пять жизней',speed:.7,lives:5,fish:1,h:96}
];
CH.forEach((c,i)=>{c.src=SRC[i];c.im=new Image();c.im.src=SRC[i]});
const W=360,H=560,GY=H-26,ui=document.getElementById('ui'),cv=document.getElementById('c'),g=cv.getContext('2d');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let best=0;try{best=+localStorage.getItem('zveryata-best')||0}catch(e){}
let S=null,tx=W/2,keys={},last=performance.now();
function menu(){
 S=null;
 ui.innerHTML='<h1>Зверята и лакомства</h1><p>Лови еду, обходи камни и кактусы. Двигай героя пальцем, мышью или стрелками.</p>'+
 CH.map((c,i)=>`<button class="pick" data-i="${i}"><img src="${c.src}" alt=""><div><b>${c.name}</b><span>${c.desc}</span></div></button>`).join('')+
 `<small>Рекорд: ${best}</small>`;
 ui.hidden=false;
}
function start(i){
 const c=CH[i];S={i,c,x:W/2,lives:c.lives,score:0,t:0,sp:0,items:[],fx:[],pop:0,over:false};
 tx=W/2;ui.hidden=true;last=performance.now();
}
function end(){
 S.over=true;
 if(S.score>best){best=S.score;try{localStorage.setItem('zveryata-best',best)}catch(e){}}
 ui.innerHTML=`<h1>Игра окончена</h1><p>${S.c.name} набрал ${S.score} очков.</p><p>Рекорд: ${best}</p><button class="big" id="again">Играть ещё раз</button><button class="big" id="home">Выбрать другого героя</button>`;
 ui.hidden=false;
}
ui.onclick=e=>{
 const b=e.target.closest('[data-i]');
 if(b)return start(+b.dataset.i);
 if(e.target.closest('#again'))return start(S.i);
 if(e.target.closest('#home'))menu();
};
function setT(e){const r=cv.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*W}
cv.addEventListener('pointermove',setT);cv.addEventListener('pointerdown',setT);
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function pw(){const c=S.c;return c.h*c.im.width/(c.im.height||1)}
function update(dt){
 const c=S.c,w=pw();S.t+=dt;S.pop=Math.max(0,S.pop-dt*4);
 const dir=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);
 if(dir)tx=S.x+dir*90;
 const m=480*c.speed*dt;S.x+=Math.max(-m,Math.min(m,tx-S.x));
 S.x=Math.max(w/2,Math.min(W-w/2,S.x));
 S.sp-=dt;
 if(S.sp<=0){
  S.sp=Math.max(.38,.95-S.t*.008);
  const r=Math.random(),badP=.22+Math.min(.15,S.t*.002);
  let it={x:22+Math.random()*(W-44),y:-24,v:150+S.t*3.5+Math.random()*50,r:Math.random()*6,bad:false,pts:1};
  if(r<badP){it.bad=true;it.e=Math.random()<.5?'🪨':'🌵'}
  else if(r>.96){it.e='⭐';it.pts=5}
  else it.e=['🐟','🍎','🍓'][Math.floor(Math.random()*3)];
  S.items.push(it);
 }
 for(const it of S.items){
  it.y+=it.v*dt;it.r+=dt*2;
  if(!it.dead&&it.y>GY-c.h*.85&&it.y<GY&&Math.abs(it.x-S.x)<w*.4){
   it.dead=true;
   if(it.bad){S.lives--;S.fx.push({x:it.x,y:it.y,t:'−1 ♥',life:.8});if(S.lives<=0)end()}
   else{const p=it.pts*(it.e==='🐟'?c.fish:1);S.score+=p;S.pop=1;S.fx.push({x:it.x,y:it.y,t:'+'+p,life:.8})}
  }
 }
 S.items=S.items.filter(it=>!it.dead&&it.y<H+30);
 S.fx.forEach(f=>{f.life-=dt;f.y-=40*dt});S.fx=S.fx.filter(f=>f.life>0);
}
function draw(){
 g.clearRect(0,0,W,H);
 if(!S)return;
 const ink=css('--ink'),c=S.c,w=pw();
 g.strokeStyle=css('--line');g.lineWidth=3;g.beginPath();g.moveTo(0,GY+2);g.lineTo(W,GY+2);g.stroke();
 g.textAlign='center';g.textBaseline='middle';g.font='30px serif';
 for(const it of S.items){g.save();g.translate(it.x,it.y);g.rotate(Math.sin(it.r)*.4);g.fillText(it.e,0,0);g.restore()}
 const sy=1+S.pop*.08;
 g.drawImage(c.im,S.x-w/2,GY-c.h*sy,w,c.h*sy);
 g.fillStyle=ink;g.font='bold 20px Georgia,serif';g.textAlign='left';g.fillText('❤'.repeat(S.lives),12,24);
 g.textAlign='right';g.fillText(S.score,W-12,24);
 g.textAlign='center';g.font='bold 18px Georgia,serif';g.fillStyle=css('--acc');
 for(const f of S.fx){g.globalAlpha=Math.min(1,f.life*2);g.fillText(f.t,f.x,f.y)}
 g.globalAlpha=1;
}
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(S&&!S.over)update(dt);
 draw();requestAnimationFrame(loop);
}
menu();requestAnimationFrame(loop);
</script>
